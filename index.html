<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Warung Kanza & Zafran</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: ceria, hangat, sabar — seperti kakak yang mengajak main
   IDEA: warung tenda pinggir jalan dengan tenda belang merah-putih
   PICTURE: adegan warung: Kanza & Zafran di balik meja, pembeli datang dengan balon bicara
   COLOUR and TYPE: kuning kunyit, merah tenda, biru tombol; Baloo 2 bulat dan tebal
   LAYOUT: HUD, adegan warung, lalu papan tugas besar di bawahnya; satu kolom di ponsel */
:root{color-scheme:light dark;--bg:light-dark(#fff3d1,#24160e);--panel:light-dark(#fffdf7,#35231a);--card:light-dark(#fff,#47301f);--ink:light-dark(#3b2414,#fff0da);--soft:light-dark(#8a6243,#e0bf9c);--line:light-dark(#f1d79f,#5e3f2b);--red:#e8412f;--blue:#1e7fe0;--good:#1c9a52}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.45 "Baloo 2",system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:4px solid var(--blue);outline-offset:2px}
.game{max-width:920px;margin:0 auto;padding-bottom:24px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;flex-wrap:wrap}
.logo{font-weight:800;font-size:17px;line-height:1;color:var(--red)}.logo b{display:block;font-size:26px;color:var(--ink);line-height:1.05}
.hud{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{background:var(--panel);border:2px solid var(--line);border-radius:99px;padding:3px 12px;font-weight:800;font-size:15px;white-space:nowrap}
.pill.st{color:#c88400}.pill.st.pop{animation:pop .4s}
#sndBtn{width:44px;height:44px;border-radius:50%;background:var(--panel);border:2px solid var(--line);font-size:20px}
.scene{position:relative;height:330px;margin:0 10px;border-radius:26px;overflow:hidden;background:radial-gradient(circle at 30% 40%,#ffe9a6,#ffc93f 70%)}
.awning{position:absolute;left:0;right:0;top:0;height:42px;background:repeating-linear-gradient(90deg,var(--red) 0 36px,#fff 36px 72px);box-shadow:0 4px 0 rgba(0,0,0,.08)}
.awning::after{content:"";position:absolute;left:0;right:0;top:42px;height:16px;background:radial-gradient(circle at 18px 0,var(--red) 17px,transparent 18px) 0 0/72px 16px repeat-x,radial-gradient(circle at 54px 0,#fff 17px,transparent 18px) 0 0/72px 16px repeat-x}
.floor{position:absolute;left:0;right:0;bottom:0;height:26px;background:repeating-linear-gradient(90deg,#d9893f 0 40px,#c97a33 40px 80px)}
.counter{position:absolute;left:0;bottom:0;width:58%;height:80px;background:linear-gradient(#b86b33,#8f4f22);border-top:10px solid #6e3a17;border-radius:0 14px 0 0;z-index:3;display:grid;place-items:center;color:#ffe3b8;font-weight:800;font-size:clamp(12px,2.4vw,17px);letter-spacing:.02em;text-align:center;padding:0 8px}
.counter::before{content:"🍲";position:absolute;top:-38px;right:14px;font-size:30px}
.cooks{position:absolute;left:3%;bottom:48px;display:flex;gap:2px;z-index:2}
.ch{width:clamp(84px,14vw,122px);text-align:center}.ch svg{width:100%;display:block}
.tag{display:inline-block;background:#fff;color:#3b2414;font-weight:800;font-size:13px;border-radius:99px;padding:0 9px;margin-bottom:-4px;position:relative;z-index:1;box-shadow:0 2px 0 rgba(0,0,0,.1);white-space:nowrap}
.guest{position:absolute;right:4%;bottom:18px;z-index:2}
.guest.enter{animation:walkin .7s cubic-bezier(.3,1.4,.5,1)}.guest.leave{transition:transform .6s,opacity .6s;transform:translateX(140%);opacity:0}
.bubble{position:absolute;top:58px;z-index:5;max-width:min(68%,430px);background:#fff;color:#3b2414;border:3px solid #3b2414;border-radius:20px;padding:8px 14px;font-size:18px;font-weight:700;line-height:1.35;box-shadow:0 5px 0 rgba(59,36,20,.18);opacity:0}
.bubble.show{animation:pop .35s forwards}
.bubble::after{content:"";position:absolute;bottom:-14px;width:22px;height:22px;background:#fff;border:3px solid #3b2414;border-top:0;border-left:0;transform:rotate(45deg) skew(10deg,10deg)}
.bubble.guest{right:3%}.bubble.guest::after{right:34px}
.bubble.cook{left:3%}.bubble.cook::after{left:34px}
.who{display:block;font-size:13px;color:var(--red);line-height:1}
.wd{display:inline-flex;gap:2px;margin:0 3px;vertical-align:middle}
.syl{display:inline-block;font-weight:800;font-size:23px;padding:0 6px;border-radius:9px;background:#fff2c2;cursor:pointer;line-height:1.3}
.s0{color:#d1301f}.s1{color:#1667c4}.qn{color:#7a3fd1;background:#efe4ff}
.say{width:36px;height:36px;border-radius:50%;background:#ffe08a;font-size:17px;vertical-align:middle;margin-left:4px;flex:none}
.panel{margin:12px 10px 0;background:var(--panel);border:3px solid var(--line);border-radius:26px;padding:16px clamp(12px,3vw,24px) 20px}
.panel.lock{pointer-events:none}
h2{font-size:clamp(21px,4vw,27px);line-height:1.15;margin:0 0 8px;text-wrap:balance;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
h3{font-size:20px;margin:14px 0 6px}
.sub{margin:0 0 10px;font-size:18px;color:var(--soft);font-weight:700}.sub b{color:var(--ink)}
.card{background:var(--card);border:3px solid var(--line);border-radius:20px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 5px 0 var(--line);transition:transform .1s}
.card:active,.ing:active,.num:active,.btn:active{transform:translateY(3px)}
.card b{font-size:21px;font-weight:800;line-height:1.1}.card small{font-size:14px;color:var(--soft);line-height:1.2}
.big{font-size:46px;line-height:1.1}
.lv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.lvc b{font-size:26px}
.cast{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.mini{text-align:center;background:var(--card);border-radius:18px;padding:6px 4px 8px;border:2px solid var(--line)}.mini svg{width:70px;display:block;margin:0 auto}
.mini b{display:block;font-size:16px;line-height:1.1}.mini small{font-size:13px;color:var(--soft);line-height:1.15;display:block}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.menu .card{min-height:80px;justify-content:center}
.right{background:#d8f8e3!important;border-color:var(--good)!important;box-shadow:0 5px 0 var(--good)!important;color:#174d2c!important}
.hint{animation:glow 1s infinite}
.shake{animation:shake .4s}
.fb{min-height:30px;margin:10px 0 0;font-size:19px;font-weight:800;text-align:center}.fb.bad{color:var(--red)}.fb.good{color:var(--good)}
.rec{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.rec li{background:var(--card);border:2px dashed var(--soft);border-radius:16px;padding:4px 12px;display:flex;align-items:center;gap:6px;font-size:21px;cursor:pointer}
.rec .n{background:var(--red);color:#fff;border-radius:50%;width:32px;height:32px;display:grid;place-items:center;font-weight:800}
.rec .nw{color:#7a3fd1;font-weight:800}.rec .ic{font-size:26px}
.cnt{font-size:15px;font-weight:800;background:#eee3d3;color:#6b4a30;border-radius:99px;padding:0 8px}.cnt.done{background:#c9f2d7;color:#155c32}.cnt.over{background:#ffd3cc;color:#a32617}
.kitchen{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px;align-items:start}
.potwrap{position:relative;text-align:center}.potwrap small{font-size:13px;color:var(--soft)}
.pot{min-height:150px;border-radius:18px 18px 70px 70px;background:linear-gradient(#cfd8dc,#90a4ae);border-top:12px solid #607d8b;padding:10px 14px 22px;display:flex;flex-wrap:wrap;gap:2px;align-content:flex-start;justify-content:center;box-shadow:inset 0 -10px 0 rgba(0,0,0,.12)}
.pot .empty{color:#455a64;font-weight:700;font-size:15px;margin-top:30px}
.pi{font-size:30px;line-height:1;width:40px;height:40px}.pi.drop{animation:drop .35s}
.pot.boil{animation:wobble .3s infinite}
.steam{position:absolute;top:-10px;font-size:30px;animation:steam 1.2s infinite;opacity:0}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.ing{background:var(--card);border:3px solid var(--line);border-radius:18px;padding:6px 2px;font-weight:800;font-size:15px;display:flex;flex-direction:column;align-items:center;box-shadow:0 4px 0 var(--line);min-height:80px;justify-content:center}
.ing span{font-size:36px;line-height:1.1}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.btn{background:var(--blue);color:#fff;border-radius:99px;padding:10px 28px;font-size:22px;font-weight:800;box-shadow:0 5px 0 #11579e;min-height:54px}
.btn.alt{background:#ffb703;color:#3b2414;box-shadow:0 5px 0 #c98a00}
.ready{text-align:center}.plate{font-size:84px;width:150px;height:150px;margin:4px auto 8px;border-radius:50%;background:radial-gradient(#fff 55%,#e3e3e3 56%,#fff 64%,#d7d7d7);display:grid;place-items:center;animation:pop .5s;box-shadow:0 8px 0 rgba(0,0,0,.1)}
.ready h2{justify-content:center}
.coins{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.five{display:inline-flex;gap:4px;padding:5px;border:2px dashed var(--soft);border-radius:16px}
.coin{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#f5c400 45%,#c99400);border:2px solid #a87b00;color:#6b4c00;font-weight:800;font-size:13px;position:relative}
.coin.counted{background:radial-gradient(circle at 35% 30%,#fff,#ffd84d 50%,#e0a800);transform:scale(1.08)}
.coin.counted::after{content:attr(data-k);position:absolute;top:-9px;right:-9px;background:var(--red);color:#fff;border-radius:50%;width:24px;height:24px;font-size:14px;display:grid;place-items:center}
.coin.x{opacity:.3;pointer-events:none}
.choices{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.num{width:92px;height:92px;border-radius:24px;background:var(--card);border:3px solid var(--line);box-shadow:0 5px 0 var(--line);font-size:38px;font-weight:800;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.num small{font-size:14px;color:var(--soft)}
.money{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;margin:8px 0 12px;font-weight:800;font-size:22px}
.note{width:130px;height:64px;border-radius:10px;background:linear-gradient(135deg,#a77bd6,#6f3fae);color:#fff;display:grid;place-items:center;font-size:24px;border:3px solid #fff;box-shadow:0 0 0 2px #6f3fae}
.price,.qbox{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:6px 14px;white-space:nowrap}.qbox{color:var(--red)}
.earn{display:grid;gap:8px}.eg{background:var(--card);border-radius:18px;border:2px solid var(--line);padding:6px 10px}
.eh{display:flex;align-items:center;gap:8px}.eh svg{width:44px}.eh b{font-size:18px}.eh span{margin-left:auto;font-weight:800;font-size:19px;white-space:nowrap}
.ov{position:fixed;inset:0;background:rgba(40,20,8,.55);display:grid;place-items:center;z-index:20;padding:16px}
.endc{background:var(--panel);border-radius:28px;padding:22px;text-align:center;max-width:380px;width:100%;animation:pop .5s;border:4px solid #ffb703}
.endc h2{justify-content:center}.trophy{font-size:72px;line-height:1}.endc p{margin:4px 0;font-size:20px;font-weight:700}
.cf{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;z-index:21;animation:fall 2.8s linear forwards}
.dots{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}.dots span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;background:var(--line);color:var(--soft)}.dots .d{background:var(--good);color:#fff}.dots .c{background:var(--red);color:#fff;transform:scale(1.15)}
.nb{color:#fff;background:var(--red);border-radius:10px;padding:0 8px;white-space:nowrap}
.station{position:relative;height:230px;border-radius:22px;background:radial-gradient(circle at 50% 30%,light-dark(#fff8e4,#3d2a1d),light-dark(#ffe2a3,#2a1b12));display:flex;flex-direction:column;align-items:center;justify-content:flex-end;overflow:hidden;margin:8px 0;touch-action:none;user-select:none;-webkit-user-select:none}
.cw{position:relative;z-index:2;flex:none;touch-action:none}
.stuff{position:absolute;left:10px;right:10px;bottom:12px;display:flex;flex-wrap:wrap;justify-content:center;align-content:flex-end;gap:0 2px;z-index:2}
.stuff.mix{animation:mix .35s}.em{font-size:30px;line-height:1.1;transition:filter .1s}
.liq{position:absolute;left:6px;right:6px;bottom:6px;border-radius:0 0 36px 36px;transition:height .4s,background .4s;overflow:hidden;z-index:1}
.liq.air{background:rgba(110,180,255,.6)}.liq.minyak{background:rgba(255,190,40,.65)}.liq.kuah{background:rgba(205,140,60,.62)}
.bub{position:absolute;bottom:0;width:12px;height:12px;border-radius:50%;border:2px solid rgba(255,255,255,.95);animation:rise 1s infinite}
.tool-panci{width:210px;height:120px;background:linear-gradient(90deg,#9fb0b9,#e3eaee 40%,#a5b5be);border-radius:8px 8px 40px 40px;border-top:10px solid #5f7682}
.tool-panci::before,.tool-panci::after{content:"";position:absolute;top:6px;width:22px;height:12px;background:#5f7682;border-radius:6px}.tool-panci::before{left:-20px}.tool-panci::after{right:-20px}
.tool-wajan{width:230px;height:80px;background:radial-gradient(ellipse at 50% 0,#5a5a5a,#1e1e1e 72%);border-radius:0 0 115px 115px/0 0 80px 80px;border-top:6px solid #444;margin-left:-40px}
.tool-wajan::after{content:"";position:absolute;right:-56px;top:2px;width:60px;height:14px;background:#6b3a1a;border-radius:8px}
.tool-wajan .liq{border-radius:0 0 110px 110px/0 0 70px 70px}
.tool-mangkuk{width:200px;height:100px;background:linear-gradient(#fff,#e6edf5);border-radius:6px 6px 100px 100px;border-top:8px solid #4a90d9;box-shadow:inset 0 -8px 0 rgba(0,0,0,.06)}
.tool-mangkuk .liq{border-radius:0 0 94px 94px}
.tool-piring{width:260px;height:64px;background:radial-gradient(ellipse at 50% 55%,#fff 52%,#e2e2e2 55%,#fff 64%,#d5d5d5 70%,transparent 71%);margin-bottom:4px}
.tool-piring .stuff{bottom:24px}
.tool-cobek{width:180px;height:76px;background:radial-gradient(ellipse at 50% 0,#8d8d8d,#4a4a4a 75%);border-radius:0 0 90px 90px}
.tool-talenan{width:240px;height:70px;background:linear-gradient(#dba56c,#b47a43);border-radius:14px;box-shadow:0 6px 0 #8a5a2e;margin-bottom:6px}
.tok{display:inline-block}.tok.slice{width:22px;height:22px;border-radius:50%;background:radial-gradient(#eaffda 38%,#8bc34a 42%,#2e6b1b 72%);margin:2px}
.tok.kecap{width:14px;height:18px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#3e1f0d;margin:4px}
.tok.sambal{width:96px;height:44px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ff7043,#c62817 70%)}
.flames{height:30px;display:flex;gap:20px;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .3s;z-index:1}.flames.on{opacity:1}
.flames i{width:18px;height:26px;background:radial-gradient(circle at 50% 80%,#fff59d,#ffb300 45%,#ff5722 75%);border-radius:50% 50% 50% 50%/65% 65% 35% 35%;animation:flick .25s infinite alternate}
.stove{width:min(290px,100%);height:40px;background:linear-gradient(#5a5a5a,#2e2e2e);border-radius:12px 12px 0 0;display:flex;justify-content:flex-end;align-items:center;padding-right:12px}
.knob{width:42px;height:42px;border-radius:50%;background:radial-gradient(#ff7b6b,#c62828);border:3px solid #fff;transition:transform .3s;position:relative}
.knob::after{content:"";position:absolute;left:50%;top:4px;width:4px;height:14px;margin-left:-2px;background:#fff;border-radius:2px}
.knob.on{transform:rotate(90deg);background:radial-gradient(#ffb74d,#ef6c00)}.knob.hint{animation:glow 1s infinite}
.table{width:100%;height:28px;background:linear-gradient(#c98a4b,#a86d35)}
.spoon{position:absolute;top:-34px;right:-6px;font-size:46px;display:none;z-index:3;transform-origin:30% 85%;pointer-events:none}.spoon.show{display:block}.spoon.go{animation:stirr .5s}
.cw.squish{animation:squish .2s}.cw.tilt{animation:tilt .85s forwards}
.bar{height:22px;border-radius:99px;background:var(--line);overflow:hidden;margin:6px auto;max-width:360px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb703,#e8412f)}
.btn.hold{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-size:24px;padding:14px 34px}
.bigc{text-align:center;font-size:36px;font-weight:800;line-height:1.1}
.tapb{width:110px;height:110px;border-radius:50%;background:var(--card);border:4px solid var(--line);font-size:56px;box-shadow:0 6px 0 var(--line)}.tapb:active{transform:translateY(4px)}
.frybar{position:relative;height:30px;border-radius:99px;background:linear-gradient(90deg,#f3e3b5,#e7b84f 60%,#6d3b12 85%,#2a1406);max-width:380px;margin:12px auto 4px}
.frybar .z{position:absolute;top:-5px;bottom:-5px;border:4px solid var(--good);border-radius:10px}
.frybar .cur{position:absolute;top:-9px;left:0;width:8px;height:48px;background:var(--ink);border-radius:4px;transform:translateX(-50%)}
.lbls{display:flex;justify-content:space-between;max-width:380px;margin:0 auto;font-size:14px;font-weight:800;color:var(--soft)}
@keyframes rise{from{transform:translateY(0);opacity:1}to{transform:translateY(-70px);opacity:0}}
@keyframes flick{to{transform:scaleY(1.25) translateY(-2px)}}
@keyframes stirr{to{transform:rotate(-360deg)}}
@keyframes squish{50%{transform:scale(1.06,.92)}}
@keyframes mix{50%{transform:rotate(7deg) scale(1.04)}}
@keyframes tilt{to{transform:translate(-50px,-30px) rotate(-40deg);opacity:0}}
.hb{width:44px;height:44px;border-radius:50%;background:var(--panel);border:2px solid var(--line);font-size:20px;flex:none}.hb.offb{opacity:.4}
.scene.quiz .cooks,.scene.quiz .counter{display:none}
.board{display:none;position:absolute;left:3%;top:66px;bottom:32px;width:56%;background:radial-gradient(circle at 30% 30%,#3c7a5c,#25533e);border:8px solid #a0612c;border-radius:16px;color:#fff;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;font-weight:800;gap:4px;z-index:2;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.scene.quiz .board{display:flex}.scene.quiz .bubble{max-width:38%}
.bd-big{font-size:clamp(58px,13vw,104px);line-height:1}.bd-em{font-size:clamp(52px,11vw,86px);line-height:1.05}
.bd-word{font-size:clamp(23px,5.2vw,40px);letter-spacing:.05em;line-height:1.15;overflow-wrap:anywhere}
.bd-small{font-size:15px;font-weight:700;opacity:.92}
.gap{display:inline-block;min-width:1.1em;border-bottom:4px solid #ffd54f;color:#ffd54f}
.bd-say{width:84px;height:84px;border-radius:50%;background:#ffd54f;font-size:40px;box-shadow:0 5px 0 #c9a227}
.bd-row{display:flex;gap:2px;justify-content:center}.bc{font-size:clamp(24px,5vw,34px);position:relative;line-height:1;padding:2px}
.bc.counted::after{content:attr(data-k);position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:50%;width:20px;height:20px;font-size:12px;display:grid;place-items:center}
.hc{display:inline-block;background:rgba(255,255,255,.18);border-radius:8px;padding:0 6px;margin:2px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:12px;margin-top:4px}
.opt{background:var(--card);border:3px solid var(--line);border-radius:22px;box-shadow:0 5px 0 var(--line);min-height:90px;font-weight:800;font-size:24px;padding:8px;line-height:1.1}
.opt:active,.tile:active,.pn:active,.sg:active{transform:translateY(3px)}

 tile(v,b){const q=S.qs[S.qi];if(q.fill.length>=q.syl.length)return;q.fill.push(+v);b.disabled=true;b.classList.add('used');sfx.pad();say(q.tiles[+v],HOST[S.kind]);drawSlots();
  if(q.fill.length===q.syl.length){if(q.fill.map(i=>q.tiles[i]).join('')===q.w.w){say(q.w.w,HOST[S.kind]);setTimeout(()=>qRight(null),900)}else{qWrong(null,'Belum pas. Susun lagi, ya!');setTimeout(()=>{q.fill=[];panel.querySelectorAll('.tile').forEach(t=>{t.disabled=false;t.classList.remove('used')});drawSlots()},900)}}},
 slot(){const q=S.qs[S.qi],i=q.fill.pop();if(i==null)return;const t=panel.querySelector(`.tile[data-v="${i}"]`);if(t){t.disabled=false;t.classList.remove('used')}tone(400,.08,'triangle');drawSlots()},
 guess(v,b){const q=S.qs[S.qi],g=+v;if(b.disabled)return;q.g.push(g);sfx.pad();
  if(g===q.secret){S.tries=q.g.length<=q.par?0:1;board.querySelector('.bd-big').textContent=g;qRight(b);return}
  const up=g<q.secret;if(up)q.lo=g+1;else q.hi=g-1;panel.querySelectorAll('.pn').forEach(p=>{const n=+p.dataset.v;if(n<q.lo||n>q.hi){p.disabled=true;p.classList.add('off')}});
  const t=up?`Lebih BESAR dari ${g}!`:`Lebih KECIL dari ${g}!`,h=HOST[S.kind];sfx.no();showGuest(h,'hmm');bubble(t,'guest',P[h].n);fb(t,'bad');say([up?'Lebih besar dari':'Lebih kecil dari',String(g)],h);
  $('#hist').innerHTML=q.g.map(x=>`<span class="hc">${x} ${x<q.secret?'⬆':'⬇'}</span>`).join('')}};

document.addEventListener('keydown',e=>{if(S.mode==='quiz'&&S.kind==='tangkap'&&S.keyMove&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();S.keyMove(e.key==='ArrowLeft'?-1:1)}});
document.addEventListener('pointerdown',()=>{ac();musicOn();unlockAudio();const g0=spGen;setTimeout(()=>{if(S.mode==='home'&&spGen===g0)homeGreet()},450)},{once:true});
document.addEventListener('click',e=>{const t=e.target.closest('[data-say]');if(t&&!t.dataset.act)say(t.dataset.say.split('|'),t.dataset.who||ctxWho());
 const b=e.target.closest('[data-act]');if(b&&ACT[b.dataset.act])ACT[b.dataset.act](b.dataset.v,b)});
applyDecor();$('#sndBtn').textContent=snd?'🔊':'🔇';$('#musBtn').classList.toggle('offb',!mus);
home();
}
